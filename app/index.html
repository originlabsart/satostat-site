<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121214">
<link rel="icon" href="../logo-mark.svg" type="image/svg+xml">
<title>Satostat app</title>
<meta name="description" content="Satostat iOS app prototype: thermostat, rewards ledger and payout wallet for the QuantumRad mining radiator. Simulated, estimated figures.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Satostat app. Same tokens as the site. Dark only. */
:root{
  --bg:#141415;
  --bg-2:#1b1b1d;
  --panel:#202023;
  --panel-2:#26262a;
  --line:#2f2f34;
  --line-2:#3c3c42;
  --ink:#f1ede3;
  --ink-2:#b9b5aa;
  --muted:#7f7c74;
  /* Small secondary text on panels. --muted is 3.9:1 on --panel, under AA for 11 px text; this is 5.3:1. */
  --sub:#97938a;
  --gold:#c9a84c;
  --gold-2:#e8cc6c;
  --gold-dim:rgba(201,168,76,.18);
  --heat:#e2663a;
  --good:#6fbf73;
  --warn:#e0b341;
  --crit:#e05a4e;
  --screen:#121214;
  --display:"Chakra Petch","Avenir Next Condensed","Futura","Rajdhani","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,monospace;
  --r:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--screen);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
#siri-in{text-align:left;padding:9px 10px;min-height:44px}
#siri-in + .btn{min-height:44px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{position:relative;height:100%;width:100%;display:grid;grid-template-rows:auto auto 1fr auto;background:var(--screen);overflow:hidden}
#main{display:contents}
/* status bar */
.sb{display:flex;justify-content:space-between;align-items:center;font-family:var(--body);font-weight:600;font-size:.8rem;color:var(--ink);padding:calc(6px + env(safe-area-inset-top)) 20px 2px 24px;font-variant-numeric:tabular-nums;line-height:1.2}
.sb .ic{display:flex;align-items:center;gap:5px}
.sb svg{display:block;height:11px;width:auto}
/* navigation title: stays put while the screen scrolls under it */
.nav{display:flex;align-items:center;justify-content:center;height:36px;padding:0 16px;font-family:var(--display);font-weight:600;font-size:.92rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border-bottom:1px solid transparent;background:var(--screen);transition:border-color .15s ease,background-color .15s ease;position:relative;z-index:2}
.nav.scrolled{border-bottom-color:var(--line);background:#161618}
/* Offline stays visible in the title bar on every tab, even when the banner has scrolled away. */
.nav.offline::after{content:"Offline";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.6rem;font-weight:400;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:rgba(224,90,78,.15);color:var(--crit)}
/* screens */
.screen{display:none;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:6px 16px 24px;min-height:0}
.screen.on{display:block}
.screen > * + *{margin-top:10px}
/* A slot holds a block that comes and goes; it has no box of its own, so the spacing is on its children. */
.slot{display:contents}
.slot:empty{display:none}
.slot > *{margin-top:10px}
.screen > .slot:first-child > :first-child{margin-top:0}
.st{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;color:var(--ink-2);margin-top:18px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;column-gap:8px;row-gap:2px}
/* The title truncates instead of pushing the pill off screen; small text drops to its own line as a unit. */
.st > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st.one{flex-wrap:nowrap}
.st .pill,.st .sr{flex-shrink:0}
.st .sr{display:flex;align-items:center;gap:8px}
.st small{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:none;color:var(--sub);font-weight:400;text-align:right;white-space:nowrap;margin-left:auto}
.nw{white-space:nowrap}
.screen > .st:first-child,.screen > .slot:empty:first-child + .st{margin-top:2px}
.screen > .st{margin-top:18px}
.big{font-family:var(--display);font-size:clamp(1.9rem,11vw,2.4rem);font-weight:700;color:var(--gold-2);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.8rem;color:var(--gold);font-family:var(--mono);font-weight:500;margin-left:5px}
/* The Today figure opens its explanation like every other Home figure. */
button.big{display:block;background:none;border:0;padding:0;text-align:left;cursor:pointer;border-radius:4px}
.sub{font-family:var(--mono);font-size:.72rem;color:var(--ink-2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);text-align:left;width:100%}
.row b{font-family:var(--mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.row span{color:var(--ink-2)}
.row small{display:block;font-size:.68rem;color:var(--sub);margin-top:2px;line-height:1.3}
.row small .nw{color:inherit}
.row .l{min-width:0;flex:1}
.row .l > span{display:block}
.row .l .pill{display:inline-block;margin-left:6px}
button.row{cursor:pointer}
button.row:active{background:var(--panel-2)}
/* grouped inset list: one rounded container, hairline separators */
.group{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.group > .row{border:0;border-radius:0;background:transparent}
.group > * + *{border-top:1px solid var(--line)!important}
.group > button.row:active{background:var(--panel-2)}
.pill{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--gold-dim);color:var(--gold-2);white-space:nowrap}
.pill.off{background:rgba(255,255,255,.07);color:var(--ink-2)}
.pill.good{background:rgba(111,191,115,.15);color:var(--good)}
.pill.warn{background:rgba(224,179,65,.15);color:var(--warn)}
.pill.crit{background:rgba(224,90,78,.15);color:var(--crit)}
.pill.heat{background:rgba(226,102,58,.15);color:var(--heat)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.seg button{padding:7px 0;border-radius:4px;color:var(--sub);background:none;border:0;cursor:pointer;font-family:inherit;font-size:inherit;letter-spacing:inherit;text-transform:inherit}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--bg);font-weight:500}
.seg.imp-unit{margin-top:10px}
.plan-rows{margin-top:8px;border-style:dashed}
.plan-row b{font-family:var(--mono);font-weight:500;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#9be29e}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin-left:-16px;margin-right:-16px;scroll-padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;padding:6px 11px;border:1px solid var(--line-2);border-radius:999px;color:var(--ink-2);background:transparent;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-2);background:var(--gold-dim)}
/* thermostat dial: ring and knob in SVG, readout in HTML so it never drops below a readable size */
.dialwrap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px;padding:2px 0}
.dialwrap.away .rb{opacity:.55}
.dial{display:grid;place-items:center}
.dbox{position:relative;width:clamp(136px,54vw,200px);max-width:calc(40vh * 200 / 180);container-type:inline-size}
.dbox svg{width:100%;height:auto;display:block;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
/* A mouse or touch drag focuses the dial (so arrow keys follow on): no ring then, even after earlier keyboard use
   (#app.dial-ptr, cleared by the next key press). Keyboard focus keeps the gold ring. */
.dbox svg:focus:not(:focus-visible),#app.dial-ptr .dbox svg:focus{outline:none}
.dbox .read{position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);display:grid;justify-items:center;gap:2px;pointer-events:none;user-select:none;-webkit-user-select:none;text-align:center}
.dbox .cur{font-family:var(--display);font-weight:700;color:var(--ink);font-size:clamp(1.6rem,21cqw,2.6rem);line-height:1;font-variant-numeric:tabular-nums}
.dbox .nowl{font-family:var(--mono);font-size:max(.62rem,5.4cqw);text-transform:uppercase;letter-spacing:.08em;color:var(--sub);line-height:1}
.dbox .dt{font-family:var(--mono);font-size:max(.7rem,6.6cqw);color:var(--ink-2);line-height:1.2;white-space:nowrap}
.dbox .dt small{font-size:inherit;text-transform:uppercase;letter-spacing:.06em;color:var(--sub)}
.dbox .dt.away{color:var(--gold-2)}
.dbox .dt.dim{color:var(--sub);font-size:max(.66rem,5.6cqw)}
.dial-live{display:flex;flex-direction:column;align-items:center;font-family:var(--mono);font-size:.74rem;color:var(--gold-2);text-align:center;font-variant-numeric:tabular-nums}
.dial-live span{white-space:nowrap}
.dial-live.idle{color:var(--sub)}
.screen > .dial-live{margin-top:2px}
.rb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);font-family:var(--display);font-size:1.3rem;font-weight:600;cursor:pointer;display:grid;place-items:center;line-height:1;flex:0 0 auto;padding:0}
.rb.sm{width:32px;height:32px;font-size:1.05rem}
.rb:active{background:var(--line-2)}
.rb:disabled{opacity:.4;cursor:default}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font-family:var(--mono);font-weight:500;min-width:62px;text-align:center;font-size:.95rem}
.tstep{display:flex;align-items:center;gap:6px}
.tstep .inp{text-align:center;padding:7px 4px;min-width:0;flex:1}
.status{font-size:.8rem;color:var(--ink-2);text-align:center;padding:0 6px;line-height:1.35}
.status b{color:var(--gold-2);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;padding:12px 18px;border-radius:var(--r);border:1px solid var(--gold);color:var(--bg);background:linear-gradient(180deg,var(--gold-2),var(--gold));cursor:pointer;width:100%}
.btn:active{transform:translateY(1px)}
/* Disabled reads as disabled, not as a dirty gold block. */
.btn:disabled{background:var(--panel-2);border-color:var(--line-2);color:var(--sub);cursor:default;transform:none}
.btn.busy:disabled{color:var(--ink-2)}
.btn.busy::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--gold-2);animation:spin 1s linear infinite}
.btn.ghost{background:transparent;color:var(--gold-2);border-color:var(--line-2)}
.btn.ghost:disabled{color:var(--sub)}
.btn.danger{background:transparent;color:var(--crit);border-color:rgba(224,90,78,.5)}
.btn.sm{padding:8px 12px;font-size:.72rem;width:auto}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);cursor:pointer;display:grid;place-items:center;font-size:1rem;flex:0 0 auto;padding:0}
.ib:active{background:var(--panel-2)}
.sw{position:relative;width:50px;height:30px;border-radius:999px;background:var(--line-2);border:0;cursor:pointer;flex:0 0 auto;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:left .15s ease}
.sw[aria-checked="true"]{background:var(--gold)}
.sw[aria-checked="true"]::after{left:23px}
.sw:disabled{opacity:.4;cursor:default}
.inp{width:100%;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r);color:var(--ink);font-family:var(--mono);font-size:.9rem;padding:9px 10px;min-width:0}
.inp.txt{font-family:var(--body)}
.inp.sm{width:96px;padding:6px 8px;font-size:.82rem;text-align:right}
.inp.md{width:min(150px,48%);padding:6px 8px;font-size:.82rem;text-overflow:ellipsis;flex:0 0 auto}
.inwrap{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.inwrap i{font-style:normal;font-family:var(--mono);font-size:.66rem;color:var(--sub);flex:0 0 3.4em;width:3.4em;text-align:left}
/* Pool picker: a typed name or one from the list, with a chevron like a picker. */
.inwrap.pick{position:relative;display:block;width:min(150px,48%)}
.inwrap.pick .inp.md{width:100%;padding-right:24px}
.inwrap.pick i{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:auto;flex:none;pointer-events:none;font-size:.7rem}
.inwrap.pick input::-webkit-calendar-picker-indicator{opacity:0}
.group > .row.poolcfg{border-top:0!important;padding-top:0;margin-top:-6px}
.poolcfg small{color:var(--sub);font-size:.66rem;overflow-wrap:anywhere;line-height:1.35}
.field{display:grid;gap:5px}
.field label{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.banner{background:rgba(224,179,65,.12);border:1px solid rgba(224,179,65,.4);color:var(--warn);border-radius:var(--r);padding:8px 10px;font-size:.76rem;line-height:1.35}
.banner.crit{background:rgba(224,90,78,.12);border-color:rgba(224,90,78,.45);color:var(--crit)}
.banner.info{background:var(--gold-dim);border-color:rgba(201,168,76,.4);color:var(--gold-2)}
.note{font-size:.74rem;color:var(--sub);line-height:1.4}
.note b{color:var(--ink-2);font-weight:500}
.spark{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 6px;background:var(--panel)}
.spark svg{width:100%;height:64px;display:block}
.sl-plot{position:relative}
.sl-dot{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#e8cc6c}
.spark .lab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:4px}
.spark .lab .v,.spark .lab .u{text-transform:none;letter-spacing:.04em}
.bars svg{width:100%;height:44px;display:block}
.spark .axis{display:flex;justify-content:space-between;gap:6px;font-family:var(--mono);font-size:.62rem;color:var(--sub);margin:3px 0 2px;white-space:nowrap}
.roomrow .mini{display:block;width:64px;height:16px;margin:3px 0 2px auto;overflow:visible}
/* A room added in the last couple of hours: the day so far is drawn dashed, so the short line reads as new, not broken. */
.roomrow .mini .nd{stroke:#3c3c42;stroke-width:1;stroke-dasharray:2 3}
/* Today starting again at midnight fades in, beside the line that says why. */
.big.newday{animation:nd .9s ease}
@keyframes nd{from{opacity:.25}to{opacity:1}}
textarea.inp{font-size:.8rem;line-height:1.4;resize:vertical;min-height:96px}
/* Lock Screen widget preview */
.lock{border-radius:14px;padding:14px 12px 16px;background:radial-gradient(120% 90% at 30% 0%,#3a3020 0%,#1d1b18 45%,#111 100%);border:1px solid var(--line-2);text-align:center}
.lock .lk-date{font-family:var(--body);font-weight:600;font-size:.8rem;color:var(--ink-2);display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.lk-inl{display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
.lk-inl svg{width:8px;height:11px;display:block}
/* circular Lock Screen gauge: room temperature on a 5 to 30 °C arc */
.wgc{position:relative;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);flex:0 0 auto}
.wgc svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.wgc b{position:absolute;left:0;right:0;top:22px;text-align:center;font-family:var(--display);font-size:.92rem;font-weight:700;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.wgc small{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:var(--mono);font-size:.6rem;letter-spacing:0;text-transform:uppercase;color:var(--ink-2)}
/* Apple Watch face with two Satostat complications */
.watchrow{display:flex;gap:16px;align-items:center}
.wbox{position:relative;flex:0 0 auto;padding-right:5px}
.wbox::after{content:"";position:absolute;right:0;top:40px;width:6px;height:24px;border-radius:3px;background:#4a4a50}
.wbox::before{content:"";position:absolute;right:1px;top:74px;width:4px;height:30px;border-radius:2px;background:#3a3a40}
.watch{position:relative;isolation:isolate;width:124px;height:150px;border-radius:34px;background:#000;border:5px solid #2b2b30;padding:12px 11px 11px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.w-time{font-family:var(--display);font-weight:600;font-size:1.45rem;color:var(--ink);text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.w-mid{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:7px;row-gap:3px;align-items:center;align-content:center;min-width:0}
.w-mid > small:only-child{grid-column:1/-1}
.w-mid .w-gauge{grid-row:1;grid-column:1}
.w-mid .w-rn{grid-row:2;grid-column:1/-1;font-size:.62rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-mid .w-tg{grid-row:1;grid-column:2;display:grid;font-family:var(--mono);font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);line-height:1.2}
.w-mid .w-tg b{font-family:var(--display);font-size:.95rem;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.w-gauge{position:relative;width:44px;height:44px;flex:0 0 auto}
.w-gauge svg{width:100%;height:100%;display:block}
.w-gauge b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:.66rem;font-weight:700;color:var(--gold-2);font-variant-numeric:tabular-nums}
.w-mid small{font-family:var(--mono);font-size:.54rem;color:var(--ink-2);line-height:1.25;min-width:0;overflow:hidden}
.w-rect{font-family:var(--mono);font-size:.54rem;line-height:1.25;color:var(--ink-2);border-top:1px solid #26262a;padding-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-rect b{display:block;font-family:var(--display);font-size:.88rem;color:var(--gold-2);font-weight:600;font-variant-numeric:tabular-nums}
.w-siri{position:absolute;inset:0;z-index:3;background:#000;display:grid;align-content:center;justify-items:center;gap:7px;padding:12px;text-align:center;font-size:.62rem;line-height:1.3;color:var(--ink);animation:tin2 .2s ease}
.w-siri .orb{width:28px;height:28px}
@keyframes tin2{from{opacity:0}to{opacity:1}}
.watchrow .note{margin:0}
/* Siri result: a banner from the top of the screen, as on iOS */
#siri{position:absolute;left:0;right:0;top:0;z-index:36;pointer-events:none}
#app.siri-on .sheet{max-height:min(88%,calc(100% - var(--siri-b,0px)))}
.siri{margin:calc(8px + env(safe-area-inset-top)) 10px 0;display:flex;gap:10px;align-items:center;padding:9px 14px 9px 9px;border-radius:22px;background:rgba(32,32,35,.95);border:1px solid var(--line-2);box-shadow:0 12px 30px rgba(0,0,0,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:sdown .25s ease}
.siri .tx{display:grid;gap:1px;min-width:0;font-size:.8rem;line-height:1.3;color:var(--ink)}
.siri .tx small{font-size:.68rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orb{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(10,10,14,.9) 0 38%,rgba(10,10,14,0) 62%),conic-gradient(from 0deg,#ff4fd8,#7a5cff,#2fd4ff,#5dffb0,#ff9a3c,#ff4fd8);box-shadow:0 0 14px rgba(122,92,255,.5);animation:spin 2.4s linear infinite}
@keyframes sdown{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
/* Home shortcut to Widgets and Siri: two mini widgets on the right */
.tile .tw{display:flex;gap:5px;flex:0 0 auto}
.row.tour{border-color:rgba(201,168,76,.45);background:linear-gradient(180deg,rgba(201,168,76,.10),rgba(201,168,76,.04))}
.row.tour{padding:7px 8px 7px 12px;min-height:40px}
.row.tour > span:first-child{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen > .slot > .row.tour{margin-top:6px}
.tile .tw i{font-style:normal;font-family:var(--mono);font-size:.66rem;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line-2);border-radius:9px;padding:4px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
/* Lightning balance towards the next on-chain sweep */
.prog{display:block;height:4px;border-radius:2px;background:var(--line-2);margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);border-radius:2px}
/* Tariff plan: the half hours that run Max before the peak */
.plan-l{display:flex;gap:7px;align-items:flex-start;margin-top:6px;line-height:1.35}
.plan-l i{flex:0 0 auto;width:9px;height:9px;border-radius:2px;background:#9be29e;box-shadow:0 0 0 1.5px var(--gold-2);margin:4px 1px 0}
.plan-l b{color:var(--gold-2);font-weight:600}
/* The plan is a sentence, so it is set in the body face, not the mono of the figures above it. */
.sub.plan-l{font-family:var(--body);font-size:.76rem;color:var(--ink-2)}
/* What the bar colours mean */
.pkey{display:flex;flex-wrap:wrap;column-gap:12px;row-gap:2px;font-family:var(--body);font-size:.68rem;color:var(--sub);margin:2px 0 4px}
.pkey span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pkey i{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.pkey i.pl{background:#9be29e;box-shadow:0 0 0 1.5px var(--gold-2)}
/* Payout history: months with their totals, the latest few first */
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin-top:12px;padding:0 2px}
.mhead b{font-weight:500;color:var(--ink-2);text-transform:none;letter-spacing:.02em;white-space:nowrap}
.slot > .mhead:first-child{margin-top:0}
.slot > .mhead + .group{margin-top:6px}
.unitrow .ib{width:30px;height:30px;font-size:.9rem}
.center{text-align:center}
.lock .lk-time{font-family:var(--display);font-weight:700;font-size:3rem;line-height:1;color:var(--ink);margin:2px 0 12px;font-variant-numeric:tabular-nums}
.lock .lk-w{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.wg{min-width:118px;flex:0 1 auto;border-radius:12px;padding:7px 12px;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);display:grid;justify-items:start;text-align:left;line-height:1.15}
.wg small{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.wg b{font-family:var(--display);font-size:1.35rem;color:var(--ink);font-variant-numeric:tabular-nums}
.wg span{font-family:var(--mono);font-size:.64rem;color:var(--gold-2)}
.bars .axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.66rem;color:var(--sub);margin:3px 0 4px;font-variant-numeric:tabular-nums}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tcell{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 8px;min-width:0}
.tcell small{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcell .v{font-family:var(--display);font-size:1.25rem;font-weight:700;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.tcell .v span{font-size:.68rem;color:var(--gold);margin-left:3px;font-family:var(--mono);font-weight:500}
.tcell .g{display:block;font-family:var(--mono);font-size:.66rem;color:var(--sub);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* a room is one card: the row opens it, the options button sits inside the same card */
.roomrow{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding-right:8px}
.roomrow .row{flex:1;min-width:0;border:0;background:transparent;padding:9px 8px 9px 12px}
.roomrow .row:active{background:var(--panel-2)}
.roomrow .ib{background:var(--panel-2)}
.roomrow .l b{font-family:var(--body);font-size:.86rem;font-weight:600;color:var(--ink);white-space:normal}
.roomrow .r{text-align:right}
.roomrow .l small.cap{color:var(--warn)}
.roomrow .r b{display:block}
.roomrow .r small{display:block;white-space:nowrap}
.roomrow .l small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--sub);font-size:.84rem;text-align:center;padding:30px 10px;line-height:1.4}
.hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.est{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.wrap-id{font-family:var(--mono);font-size:.72rem;word-break:break-all;color:var(--ink-2);background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;line-height:1.4}
.words{display:grid;grid-template-columns:1fr 1fr;gap:6px;counter-reset:w}
.words span{font-family:var(--mono);font-size:.8rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;color:var(--ink)}
.words span::before{counter-increment:w;content:counter(w) ". ";color:var(--sub)}
.check{display:flex;gap:10px;align-items:center;font-size:.86rem;cursor:pointer;padding:2px 0}
.check input{width:20px;height:20px;accent-color:var(--gold);margin:0;flex:0 0 auto}
.days{display:flex;gap:5px}
.days button{flex:1;padding:7px 0;border-radius:var(--r);border:1px solid var(--line-2);background:transparent;color:var(--sub);font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;min-width:0}
.days button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-2);background:var(--gold-dim)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:grid;gap:8px;margin-top:4px}
.types{display:grid;gap:6px}
.types button{text-align:left;display:grid;gap:1px;min-width:0;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line-2);background:transparent;color:var(--ink);font-size:.82rem;cursor:pointer}
.types button span{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.types button small{font-family:var(--mono);font-size:.66rem;color:var(--sub);line-height:1.35}
.types button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-dim)}
/* action list, as on iOS: one container, hairline separators */
.alist{display:grid;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.alist button{background:transparent;border:0;color:var(--gold-2);font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;padding:13px 14px;text-align:center;cursor:pointer}
.alist button + button{border-top:1px solid var(--line)}
.alist button:active{background:var(--panel-2)}
.alist button.crit{color:var(--crit)}
/* tab bar */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:#0f0f10;padding:5px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{background:none;border:0;color:var(--sub);font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;display:grid;justify-items:center;gap:3px;padding:4px 0 2px;cursor:pointer;border-radius:8px;min-width:0}
.tab span{white-space:nowrap}
.tab svg{width:20px;height:20px;display:block}
.tab[aria-selected="true"]{color:var(--gold-2)}
/* sheets */
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;border:0;padding:0;width:100%;cursor:default}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line-2);border-radius:16px 16px 0 0;padding:0 16px calc(16px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;overflow-x:hidden;z-index:21;display:block;animation:up .18s ease;scroll-padding:64px 0 96px}
/* one stepper size inside a sheet */
.sheet .rb,.sheet .rb.sm{width:36px;height:36px;font-size:1.1rem}
.sheet > * + *{margin-top:12px}
.sheet p{margin-bottom:0;font-size:.84rem;color:var(--ink-2);line-height:1.45}
/* the stack spacing above wins over the browser's default paragraph margin */
.sheet > * + p{margin-top:12px}
.sheet > p:first-child{margin-top:0}
.sheet p b{color:var(--ink);font-weight:500}
.sheet p.note{font-size:.74rem;color:var(--sub)}
.sheet .big{font-size:1.9rem}
.sheet .big + p{margin-top:8px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
/* The panel colour runs out to the sheet's edges, so a focus ring scrolled under the header never shows beside it. */
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:2;background:var(--panel);padding:16px 0 8px;border-bottom:1px solid var(--line);box-shadow:-16px 0 0 var(--panel),16px 0 0 var(--panel)}
.sheet-h::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line-2)}
.sheet-h b{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:.9rem}
/* primary action stays in reach while the sheet scrolls */
.sheet .actions.sticky{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));z-index:2;background:var(--panel);margin-bottom:calc(-16px - env(safe-area-inset-bottom));padding:10px 0 calc(16px + env(safe-area-inset-bottom))}
/* The shadow above a sticky footer shows only while there is more content scrolled behind it (edgeShade). */
#sheet.more .sheet .actions.sticky{box-shadow:0 -10px 12px -10px rgba(0,0,0,.6)}
/* toast: sits just above the tab bar, never over the status bar or title, never blocking a tap. --tabh is
   the measured tab bar height (it already includes the bottom safe area). Inside a sheet with an action
   button the message is shown inline above that button instead (.smsg). */
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh,56px) + 8px);background:var(--panel-2);border:1px solid var(--line-2);border-radius:14px;padding:8px 14px;font-size:.76rem;line-height:1.35;z-index:30;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none;animation:tin .18s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
#app.sheet-open .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
.sheet .smsg{margin:0;font-size:.78rem;line-height:1.35;color:var(--gold-2);text-align:center}
/* visually hidden, still read by screen readers */
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* ?embed=1: a compact status bar, as in marketing screenshots, centred on the site phone's 84x22 notch (top 8px) */
#app.embed .sb{padding:calc(13px + env(safe-area-inset-top)) 16px 1px 18px;font-size:.7rem;line-height:1.1}
#app.embed .sb svg{height:9px}
/* The embedded phones on the site never scroll inside: a mouse wheel or a swipe over them scrolls the
   page. The "Try the app" modal is where the app scrolls. */
#app.embed .screen{overflow:hidden}
/* So the rest of an embedded screen is one tap away: a pill at the left of the title bar opens the site's full-size
   phone on the same tab, where the screen scrolls. It only shows while the screen has more below what is in view,
   and sits in the title bar so it never covers a control. renderMore sets its top to the title bar's. */
#more{position:absolute;left:10px;top:0;z-index:25;pointer-events:none}
.embmore{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 11px;border-radius:999px;border:1px solid rgba(201,168,76,.6);background:#1b1b1d;color:var(--ink-2);font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;cursor:pointer;box-shadow:0 -6px 18px rgba(18,18,20,.95),0 6px 16px rgba(0,0,0,.5)}
.embmore b{color:var(--gold-2);font-weight:500}
.embmore svg{width:10px;height:10px;display:block}
.embmore.nudge{animation:mnudge .7s ease}
@keyframes mnudge{0%,100%{transform:none}35%{transform:translateY(-5px)}65%{transform:translateY(1px)}}
/* Embedded on the site, a vertical swipe that starts on the dial scrolls the page. The knob (with a finger-sized
   grab area round it) still drags in any direction, and a tap on the ring still sets the target. */
#app.embed .dbox svg{touch-action:pan-y}
.dbox .kgrab{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;touch-action:none;cursor:pointer;z-index:1}
/* ?sb=0: no simulated status bar, for the site modal on a phone where the device draws its own */
#app.nosb .sb{visibility:hidden;height:0;padding:0;overflow:hidden}
/* onboarding */
.onb{position:absolute;inset:0;background:var(--screen);z-index:40;display:grid;grid-template-rows:auto auto 1fr auto;padding:0 20px;overflow-y:auto}
.onb .sb{margin:0 -20px}
.onb .top{display:flex;align-items:center;gap:10px;min-height:36px;padding-top:4px}
.onb .top .ib{width:32px;height:32px;font-size:1.2rem}
/* The content starts near the top; on a tall screen the space below it holds a dial (or the Wi-Fi scan), centred,
   so the screen never reads as half empty. On a short one the art shrinks out of the way. */
.onb .body{display:flex;flex-direction:column;gap:12px;padding:clamp(12px,7vh,64px) 0 10px}
.onb .art{flex:1 1 auto;min-height:0;display:grid;place-items:center;padding:8px 0}
.onb .art .odial{width:min(64vw,250px,34vh);height:auto;display:block;overflow:visible}
.onb .art .scan .ring,.onb .art .scan .found{width:min(40vw,150px,22vh);height:min(40vw,150px,22vh)}
.onb .art .scan .found svg{width:44%;height:44%}
.onb h1{font-family:var(--display);font-size:clamp(1.5rem,7vw,2rem);text-transform:uppercase;font-style:italic;margin:0;line-height:1.05;letter-spacing:.02em}
.onb h1 em{color:var(--gold-2);font-style:italic}
.onb p{margin:0;color:var(--ink-2);font-size:.9rem;line-height:1.45}
.onb .lead{color:var(--ink);font-weight:500}
.onb .logo{width:64px;height:64px;display:block}
.onb .steps{display:flex;gap:6px;justify-content:center;padding:6px 0 0}
.onb .steps i{width:18px;height:3px;border-radius:2px;background:var(--line-2)}
.onb .steps i.on{background:var(--gold)}
/* The footer carries the bottom safe-area padding itself, so nothing scrolls into a strip below it. */
.onb .foot{display:grid;gap:8px;position:sticky;bottom:0;background:var(--screen);padding:8px 0 calc(16px + env(safe-area-inset-bottom))}
#onb.more .foot{box-shadow:0 -12px 14px -12px rgba(0,0,0,.8)}
.onb .fine{font-size:.7rem;color:var(--sub);text-align:center;margin:0}
.scan{display:grid;place-items:center;padding:8px 0}
.scan .ring{width:88px;height:88px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--gold);animation:spin 1s linear infinite}
.scan .found{width:88px;height:88px;border-radius:50%;border:2px solid var(--good);display:grid;place-items:center;color:var(--good)}
.scan .found svg{width:40px;height:40px;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.brand{font-family:var(--display);font-weight:700;font-style:italic;letter-spacing:.06em;text-transform:uppercase;font-size:1.1rem;color:var(--gold-2)}
.link{background:none;border:0;color:var(--gold-2);font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:8px}
@media (max-height:460px){
  .dbox{width:clamp(110px,30vh,140px)}
  .dbox .dt small{display:block}
  .big{font-size:1.5rem}
  .screen{padding:4px 12px 14px}
  .screen > * + *{margin-top:7px}
  .sb{padding-top:3px}
  .nav{height:26px;font-size:.78rem}
  #app.sheet-open .toast{bottom:calc(80px + env(safe-area-inset-bottom))}
  .tabs{padding-top:3px}
  .tab{font-size:.56rem}
  .tab svg{width:16px;height:16px}
  .onb .top{min-height:30px;padding-top:0}
  .onb .foot{padding-bottom:8px}
  .onb .logo{display:none}
  .onb h1{font-size:1.3rem}
  .onb p{font-size:.8rem}
  .onb .body{gap:7px;padding:4px 0}
  .onb .foot{gap:4px;padding-top:6px}
  .onb .link{padding:4px}
  .onb .btn{padding:9px 14px}
  .chips{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
}
@media (max-width:340px){
  .screen{padding-left:12px;padding-right:12px}
  .seg{font-size:.6rem;letter-spacing:.03em}
  .row{font-size:.74rem;padding:8px 10px}
  .tcell .v{font-size:1.05rem}
  .tcell{padding:9px 7px 7px}
  .tcell small{font-size:.62rem;letter-spacing:.02em}
  .tcell .g{font-size:.62rem}
  .tab{font-size:.6rem;letter-spacing:.02em}
  .chips{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
  /* Start and End sit side by side in the window sheet: smaller step buttons leave room for HH:MM. */
  .sheet .tstep{gap:4px}
  .sheet .tstep .rb.sm{width:30px;height:30px;font-size:1rem}
  .sheet .tstep .inp{padding:7px 0;font-size:.85rem;min-width:52px}
  /* The unit name above the dial gets the room; "Estimated" is on every other tab and in the dial note. */
  .st .sr small.hx{display:none}
  /* all twelve words above the onboarding footer */
  .words{grid-template-columns:repeat(3,1fr);gap:4px}
  .words span{font-size:.66rem;padding:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
/* iOS Safari zooms the page into any field under 16 px when it gets focus. */
@media (pointer:coarse){
  .inp,.inp.sm,.inp.md,textarea.inp,.sheet .tstep .inp{font-size:16px}
}
@media (max-height:600px){
  .onb .art .odial{display:none}
  .types{gap:4px}
  .types button{padding:6px 10px}
  .words span{padding:4px 6px}
}

<div id="app">
  <div class="sb" id="sb"><span>09:41</span></div>

<script>
(function(){
'use strict';
/* ============================================================
   1. Tokens and helpers
   ============================================================ */
var KEY='satostat-app-v1', VERSION=1, MIN=60000, HALF=1800000, DAY=86400000;
var UNITS={
  /* Power per mode = boards active x 135 W, with ECO/COMFORT/MAX = 1/3, 2/3, all boards (rounded up, min 1).
     V1 uses the spec's own 400/600/800 W figures. V2-8 Eco runs 4 boards (540 W), because the spec gives
     the V2-8 range as 540-1080 W. Hashrate is boards x the spec's rounded per-unit maximum (13, 26, 51 TH/s),
     so the Add room sheet matches the site. Surface and acoustic figures stay within the spec's 48/58/68 °C and
     <28/<34/<40 dB(A) for Eco/Comfort/Max, scaled down for small units: one board at 135 W runs at about
     42 °C and 24 dB(A), whichever unit it is in. */
  'V1':  {name:'QuantumRad V1 wall',  boards:6, w:[400,600,800],   th:[19,28,38],        surf:[48,58,68], db:[27,33,39]},
  'V2-2':{name:'QuantumRad V2-2',     boards:2, w:[135,270,270],   th:[6.5,13,13],       surf:[42,52,52], db:[24,30,30]},
  'V2-4':{name:'QuantumRad V2-4',     boards:4, w:[270,405,540],   th:[13,19.5,26],      surf:[46,55,64], db:[26,31,36]},
  'V2-8':{name:'QuantumRad V2-8',     boards:8, w:[540,810,1080],  th:[25.5,38.3,51],    surf:[48,58,68], db:[27,33,39]},
  'DD':  {name:'Diamond Desktop',     boards:1, w:[135,135,135],   th:[6.4,6.4,6.4],     surf:[42,42,42], db:[24,24,24]}
};
var TYPE_ORDER=['V1','V2-2','V2-4','V2-8','DD'];
var MODES=['eco','comfort','max'];
var MODE_LABEL={auto:'Auto',eco:'Eco',comfort:'Comfort',max:'Max'};
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
/* Payout history rows shown before "Show all". */

/* "Fetching today's prices": the pilot build makes the day's 48 prices on the phone, the same for every
   instance on the same simulated day and region, after a short wait like a network fetch. */

  var d=new Date(t),day=Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate(),12).getTime()/DAY),p=[],k;
  if(src==='agile'){var ri=0;REGIONS.forEach(function(x,i){if(x[0]===region)ri=i});var R=REGIONS[ri];
    for(k=0;k<48;k++)p.push(round4(AGILE_DAY[k]*R[2]*(0.98+0.04*rnd(day*977+ri*7919+k*131))/100));
    return {name:'Octopus Agile, '+R[1],p:p}}
  if(src==='go'){for(k=0;k<48;k++)p.push(k<=10||k===47?0.07:0.275);return {name:'Intelligent Octopus Go',p:p}}
  if(src==='e7'){for(k=0;k<48;k++)p.push(k>=1&&k<15?0.151:0.334);return {name:'Economy 7',p:p}}

  if(R.length)out.push(['Set the '+lowerName(R[R.length>2?2:0])+' to 21 degrees','Target temperature']);
  if(R[0])out.push(['Boost the '+lowerName(R[0]),'One hour at target +2 °C']);

    var sc=document.getElementById('scr-heat');if(sc)sc.__html=null;render()}
  svg.addEventListener('pointermove',move);svg.addEventListener('lostpointercapture',up);window.addEventListener('pointerup',up,true);window.addEventListener('pointercancel',up,true);window.addEventListener('blur',up);
  if(!lazy)move(e);
});

/* ------------------------------------------------------------
   Tick: one 1 s interval. Load, integrate, render.
   ------------------------------------------------------------ */
function awayToast(g,capped){toast('While the app was closed: about '+fmtInt(g)+' '+satsWord(g)+' ('+gbp(satsGbp(Engine.state,g))+'), estimated'+(capped?'. You were away more than a simulated day, so the demo caught up 24 simulated hours, the most it counts':''),capped?6000:4000)}
/* The demo's "Show me": back to 60x once the plan's first Max half hour has started (or the run has gone on far
   longer than it should, say with every room on a manual mode). */
function tourCheck(){
  var s=Engine.state,T=s&&s.tour;if(!T)return;
  var on=s.rooms.some(function(r){return r.live&&r.live.preWhy==='peak'}),late=!(isObj(T)&&num_(T.until)&&s.simClock<T.until)||s.home.tariff!=='agile';
  if(!on&&!late)return;
  Engine.act(function(st){if(!st.tour)return;st.tour=null;if(st.speed===600)st.speed=60});
  if(on){toast('Pre-heating for the peak has started. Clock back to 60×',4000);var r=null;s.rooms.forEach(function(x){if(!r&&x.live&&x.live.preWhy==='peak')r=x});if(r&&ui.tab==='heat'&&!ui.sheet)ui.room=r.id}
}
function tick(){
  try{
    var now=Date.now(),snap=Engine.memOnly?undefined:Engine.load();
    var before=snap?snap.state.wallet.lifetimeSats:null,elapsed=snap?now-snap.t:0;
    Engine.sync(now);
    if(ui.firstTick){ui.firstTick=false;var ag=Engine.state.awayGain;
      /* The first instance to open integrates the closed period and records the gain, so the other
         embedded instances, which load the already-integrated snapshot, show the same note. */
      if(before!=null&&elapsed>120000){var gained=Math.round(Engine.state.wallet.lifetimeSats-before),capped=elapsed*(snap.state.speed||60)>DAY;if(gained>=1){Engine.state.awayGain={sats:gained,t:now,capped:capped};Engine.save(Engine.t);awayToast(gained,capped)}}
      else if(ag&&isFinite(ag.sats)&&ag.sats>=1&&now-ag.t>=0&&now-ag.t<15000)awayToast(ag.sats,ag.capped===true)}
    tourCheck();
    if(ui.toast&&Date.now()>=ui.toast.until)ui.toast=null;
    render();
  }catch(e){recover()}
}
/* Saved data that still breaks the app: start again once with a fresh home rather than freeze. */
function recover(){
  if(!ui.recovered){
    ui.recovered=true;var now=Date.now();
    Engine.state=Engine.fresh(now);Engine.t=now;Engine.lastWrite=0;Engine.had=false;Engine.passive=false;Engine.save(now,true);
    if(Engine.onReset)Engine.onReset('gone');
    toast('Saved demo data could not be read, so it was reset');
  }
  try{render()}catch(x){}
}
function init(){
  if(EMBED)$('#app').classList.add('embed');
  if(params.get('sb')==='0')$('#app').classList.add('nosb');
  /* The site modal says whether the device draws its own status bar (full bleed on a phone) as it rotates. */
  window.addEventListener('message',function(e){if(e.source!==window.parent||window.parent===window)return;var d=e.data;if(d&&d.satostat==='sb'&&typeof d.show==='boolean')$('#app').classList.toggle('nosb',!d.show)});
  Engine.fresh=function(now){return DEMO?seedDemo(now):baseState(now)};
  /* 'gone': another instance cleared the home. 'replaced': another instance reset the demo in place. */
  Engine.onReset=function(kind){ui.onbPreview=false;ui.sheet=null;ui.draft=null;ui.room=null;ui.drag=null;resetScroll();if(kind!=='replaced')ui.tab='home';if(ui.toast&&ui.toast.inSheet)ui.toast=null;if(ui.onb.scanTimer)clearTimeout(ui.onb.scanTimer);clearTimeout(ui.updateTimer);ui.updateTimer=null;ui.onb={step:0,found:false,written:false,words:[],name:'Living room',target:21,scanTimer:null};ui.update=null};
  var now=Date.now(),snap=Engine.load();
  if(snap){Engine.state=snap.state;Engine.t=snap.t;Engine.had=true}
  else if(DEMO){Engine.state=seedDemo(now);Engine.t=now;Engine.save(now)}
  else{Engine.state=baseState(now);Engine.t=now}
  tick();
  /* Every instance ticks just after the same wall-clock second, so phones side by side on the site step their
     shared clock together instead of up to a second apart. */
  setTimeout(function(){tick();setInterval(tick,1000)},1000-Date.now()%1000+15);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
}
init();
})();
</script>
